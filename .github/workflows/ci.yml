name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: "5.1"
      - uses: leafo/gh-actions-luarocks@v5
      - run: luarocks install luacheck && luarocks install busted
      - run: luacheck .
      - run: busted
